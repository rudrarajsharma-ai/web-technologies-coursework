<!DOCTYPE html>
<html>
<head>
<title>Admission Enquiry Form</title>
</head>
<body>
<h1>Admission Enquiry Form</h1>
<form>
<table border="3" cellpadding="5" cellspacing="0" style="background-color: lightblue;">
<tr>
<td>Name</td>
<td colspan="3"><input type="text" size="40"></td>
</tr>
<tr>
<td>Address</td>
<td colspan="3"><input type="text" value="Nashik" size="40"></td>
</tr>
<tr>
<td>Mobile Number</td>
<td colspan="3"><input type="text" size="20"></td>
</tr>
<tr>
<td>DOB</td>
<td colspan="3"><input type="text" value="mm/dd/yyyy" size="25"></td>
</tr>
<tr>
<td>Email-id</td>
<td colspan="3"><input type="text" size="40"></td>
</tr>
<tr>
<td>Gender</td>
<td colspan="3">
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other
</td>
</tr>
<tr>
<td>Hobbies</td>
<td colspan="3">
<input type="checkbox"> Programming<br>
<input type="checkbox"> Construction<br>
<input type="checkbox"> Designing
</td>
</tr>
<tr>
<td>Select Branch</td>
<td colspan="3">
<select>
<option>Computer</option>
<option>Civil</option>
<option>E &amp; Tc</option>
</select>
</td>
</tr>
<tr>
<td>Rate this Site</td>
<td colspan="3"><input type="text" value="5" size="5"></td>
</tr>
<tr>
<td>Comments</td>
<td colspan="3">
<textarea rows="3" cols="35">Give Your Comments Here</textarea>
</td>
</tr>
<tr>
<td colspan="4">
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</td>
</tr>
</table>
</form>
</body>
</html>
