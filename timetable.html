<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Example-6</title>
</head>
<body>

<h2>HTML Table Example-6</h2>

<table border="1">

    <tr bgcolor="lightblue">
        <th>Time/Day</th>
        <th>Monday</th>
        <th>Tuesday</th>
        <th>Wednesday</th>
        <th>Thursday</th>
    </tr>

    <tr bgcolor="lightgray">
        <td>10:00-11:00</td>
        <td>DBMS</td>
        <td>Maths</td>
        <td>DBMS</td>
        <td>DBMS</td>
    </tr>

    <tr bgcolor="lightgray">
        <td>11:00-12:00</td>
        <td>WT</td>
        <td>DBMS</td>
        <td>WT</td>
        <td>Maths</td>
    </tr>

    <tr>
        <td bgcolor="lightgray">12:00-12:30</td>
        <td colspan="4" bgcolor="lightgreen">Lunch Break</td>
    </tr>

    <tr bgcolor="lightgray">
        <td>12:30-1:30</td>
        <td>Maths</td>
        <td rowspan="2">DBMS(LPR)<br>T1 Batch</td>
        <td>Maths</td>
        <td rowspan="2">DBMS(LPR)<br>T2 Batch</td>
    </tr>

    <tr bgcolor="lightgray">
        <td>1:30-2:30</td>
        <td>ADS</td>
        <td>ADS</td>
    </tr>

</table>

</body>
</html>
